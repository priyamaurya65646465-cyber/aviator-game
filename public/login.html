<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secure Login / Register - Big Daddy</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #0c0e17; color: #fff; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 440px; background: #121520; min-height: 100vh; display: flex; flex-direction: column; padding: 24px 20px; }

        .logo-box { text-align: center; margin: 25px 0 20px 0; }
        .logo-title { font-size: 26px; font-weight: 900; background: linear-gradient(135deg, #f5d061, #e6a119); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1.5px; }
        .logo-subtitle { font-size: 12px; color: #8d98ab; margin-top: 5px; }

        /* Auth Tabs */
        .tab-box { display: flex; background: #1a1f2e; border-radius: 12px; padding: 4px; margin-bottom: 20px; border: 1px solid #28324a; }
        .tab-btn { flex: 1; padding: 10px 0; text-align: center; font-size: 14px; font-weight: 800; border-radius: 9px; cursor: pointer; color: #8a99ad; transition: all 0.2s ease; }
        .tab-btn.active { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; box-shadow: 0 2px 8px rgba(245,158,11,0.3); }

        /* Form */
        .form-panel { display: flex; flex-direction: column; gap: 14px; }
        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-label { font-size: 12px; font-weight: 700; color: #8fa0b5; text-transform: uppercase; }

        .field-wrap { display: flex; align-items: center; background: #090c13; border: 1px solid #28344e; border-radius: 10px; padding: 12px 14px; gap: 10px; }
        .prefix { font-size: 14px; font-weight: 800; color: #f59e0b; border-right: 1px solid #28344e; padding-right: 10px; }
        .text-input { background: transparent; border: none; outline: none; color: #fff; font-size: 15px; font-weight: 600; width: 100%; }

        .otp-btn { background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 8px 12px; font-size: 11px; font-weight: 800; cursor: pointer; white-space: nowrap; }

        .extra-links { display: flex; justify-content: flex-end; margin-top: -4px; }
        .forgot-link { font-size: 12px; color: #f59e0b; text-decoration: none; font-weight: 700; cursor: pointer; }

        .btn-action { margin-top: 10px; width: 100%; padding: 14px; border-radius: 10px; border: none; font-size: 15px; font-weight: 900; background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 15px rgba(245,158,11,0.3); }
        .btn-action:active { transform: scale(0.98); }

        .security-badge { margin-top: 20px; font-size: 11px; color: #10b981; text-align: center; background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.2); padding: 10px; border-radius: 8px; font-weight: 700; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="logo-box">
        <div class="logo-title">BIG DADDY</div>
        <div class="logo-subtitle">Official Online Gaming & Casino Platform</div>
    </div>

    <div class="tab-box" id="auth-tabs">
        <div class="tab-btn active" id="tab-login" onclick="switchView('login')">LOGIN</div>
        <div class="tab-btn" id="tab-register" onclick="switchView('register')">REGISTER</div>
    </div>

    <!-- 1. LOGIN FORM -->
    <div class="form-panel" id="login-form">
        <div class="input-group">
            <label class="input-label">Mobile Number</label>
            <div class="field-wrap">
                <span class="prefix">+91</span>
                <input type="tel" id="login-phone" class="text-input" placeholder="Enter 10-digit number" maxlength="10">
            </div>
        </div>

        <div class="input-group">
            <label class="input-label">Password</label>
            <div class="field-wrap">
                <input type="password" id="login-pass" class="text-input" placeholder="Enter password">
            </div>
        </div>

        <div class="extra-links">
            <span class="forgot-link" onclick="switchView('forgot')">Forgot Password?</span>
        </div>

        <button class="btn-action" onclick="handleLogin()">LOGIN NOW</button>
    </div>

    <!-- 2. REGISTER FORM -->
    <div class="form-panel" id="register-form" style="display: none;">
        <div class="input-group">
            <label class="input-label">Mobile Number</label>
            <div class="field-wrap">
                <span class="prefix">+91</span>
                <input type="tel" id="reg-phone" class="text-input" placeholder="Enter 10-digit number" maxlength="10">
            </div>
        </div>

        <div class="input-group">
            <label class="input-label">Set Password</label>
            <div class="field-wrap">
                <input type="password" id="reg-pass" class="text-input" placeholder="Minimum 4 characters">
            </div>
        </div>

        <div class="input-group">
            <label class="input-label">Invite Code (Optional)</label>
            <div class="field-wrap">
                <input type="text" id="reg-invite" class="text-input" placeholder="e.g. BDG888" value="BDG888">
            </div>
        </div>

        <button class="btn-action" onclick="handleRegister()">REGISTER & GET ₹1,000 BONUS</button>
    </div>

    <!-- 3. FORGOT PASSWORD FORM -->
    <div class="form-panel" id="forgot-form" style="display: none;">
        <div style="font-size:14px; font-weight:800; color:#f59e0b; text-align:center; margin-bottom:4px;">RESET PASSWORD</div>

        <div class="input-group">
            <label class="input-label">Registered Mobile Number</label>
            <div class="field-wrap">
                <span class="prefix">+91</span>
                <input type="tel" id="forgot-phone" class="text-input" placeholder="Enter 10-digit number" maxlength="10">
                <button class="otp-btn" type="button" onclick="sendResetOTP()">SEND OTP</button>
            </div>
        </div>

        <div class="input-group">
            <label class="input-label">Enter 4-Digit OTP</label>
            <div class="field-wrap">
                <input type="text" id="forgot-otp" class="text-input" placeholder="Enter OTP received" maxlength="4">
            </div>
        </div>

        <div class="input-group">
            <label class="input-label">New Password</label>
            <div class="field-wrap">
                <input type="password" id="forgot-newpass" class="text-input" placeholder="Enter new password">
            </div>
        </div>

        <button class="btn-action" onclick="handleResetPassword()">UPDATE PASSWORD</button>

        <div style="text-align: center; margin-top: 10px;">
            <span class="forgot-link" onclick="switchView('login')">◀ Back to Login</span>
        </div>
    </div>

    <div class="security-badge">
        🔒 256-Bit Encrypted Secure Database
    </div>
</div>

<script>
    let generatedOTP = null;

    function switchView(type) {
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('register-form').style.display = 'none';
        document.getElementById('forgot-form').style.display = 'none';
        document.getElementById('auth-tabs').style.display = (type === 'forgot') ? 'none' : 'flex';

        if (type === 'login') {
            document.getElementById('tab-login').classList.add('active');
            document.getElementById('tab-register').classList.remove('active');
            document.getElementById('login-form').style.display = 'flex';
        } else if (type === 'register') {
            document.getElementById('tab-register').classList.add('active');
            document.getElementById('tab-login').classList.remove('active');
            document.getElementById('register-form').style.display = 'flex';
        } else if (type === 'forgot') {
            document.getElementById('forgot-form').style.display = 'flex';
        }
    }

    // 1. Strict Registration Logic
    function handleRegister() {
        const phone = document.getElementById('reg-phone').value.trim();
        const pass = document.getElementById('reg-pass').value.trim();

        if (phone.length !== 10 || isNaN(phone)) {
            return alert('Kripya 10-digit ka valid mobile number dalein!');
        }
        if (pass.length < 4) {
            return alert('Password kam se kam 4 characters ka hona chahiye!');
        }

        const users = JSON.parse(localStorage.getItem('bdg_users') || '{}');

        // Check if user already exists
        if (users[phone]) {
            alert('⚠️ Yeh mobile number pehle se registered hai! Kripya LOGIN karein.');
            switchView('login');
            document.getElementById('login-phone').value = phone;
            return;
        }

        // Save new user
        users[phone] = { phone, pass, balance: 1000.00 };
        localStorage.setItem('bdg_users', JSON.stringify(users));

        // Set session
        localStorage.setItem('bdg_auth_user', phone);
        localStorage.setItem('bdg_balance', 1000.00);

        alert('🎉 Registration Successful! Welcome Bonus ₹1,000 credited.');
        window.location.href = '/';
    }

    // 2. Strict Login Logic (Only Registered Users Allowed)
    function handleLogin() {
        const phone = document.getElementById('login-phone').value.trim();
        const pass = document.getElementById('login-pass').value.trim();

        if (!phone || !pass) {
            return alert('Phone aur Password dono fill karein!');
        }
        if (phone.length !== 10 || isNaN(phone)) {
            return alert('Kripya 10-digit ka mobile number dalein!');
        }

        const users = JSON.parse(localStorage.getItem('bdg_users') || '{}');
        const user = users[phone];

        // Strict Check: Agar registered nahi hai toh block karein
        if (!user) {
            alert('❌ Yeh account exist nahi karta!\nPehle "REGISTER" tab par jakar account banayein.');
            switchView('register');
            document.getElementById('reg-phone').value = phone;
            return;
        }

        // Strict Check: Password match hona hi chahiye
        if (user.pass !== pass) {
            return alert('❌ Galat Password! Kripya sahi password dalein ya Forgot Password use karein.');
        }

        // Login approved
        localStorage.setItem('bdg_auth_user', phone);
        if (user.balance !== undefined) {
            localStorage.setItem('bdg_balance', user.balance);
        } else {
            localStorage.setItem('bdg_balance', 1000.00);
        }

        alert('✅ Login Successful! Welcome back.');
        window.location.href = '/';
    }

    // 3. Send Reset OTP
    function sendResetOTP() {
        const phone = document.getElementById('forgot-phone').value.trim();
        if (phone.length !== 10 || isNaN(phone)) {
            return alert('Pehle 10-digit ka mobile number dalein!');
        }

        const users = JSON.parse(localStorage.getItem('bdg_users') || '{}');
        if (!users[phone]) {
            return alert('❌ Yeh mobile number registered nahi hai!');
        }

        // 4-Digit Demo OTP
        generatedOTP = Math.floor(1000 + Math.random() * 9000).toString();
        alert(`📩 [BIG DADDY OTP]: Aapka password reset OTP hai: ${generatedOTP}`);
    }

    // 4. Reset Password Logic
    function handleResetPassword() {
        const phone = document.getElementById('forgot-phone').value.trim();
        const otp = document.getElementById('forgot-otp').value.trim();
        const newpass = document.getElementById('forgot-newpass').value.trim();

        if (!phone || !otp || !newpass) {
            return alert('Sabhi fields bharna zaroori hai!');
        }
        if (otp !== generatedOTP) {
            return alert('❌ Galat OTP! Sahi OTP dalein.');
        }
        if (newpass.length < 4) {
            return alert('Naya password kam se kam 4 characters ka hona chahiye!');
        }

        const users = JSON.parse(localStorage.getItem('bdg_users') || '{}');
        if (users[phone]) {
            users[phone].pass = newpass;
            localStorage.setItem('bdg_users', JSON.stringify(users));
            alert('🎉 Password successfully update ho gaya! Ab naye password se login karein.');
            switchView('login');
            document.getElementById('login-phone').value = phone;
            document.getElementById('login-pass').value = '';
        }
    }
</script>
</body>
</html>
