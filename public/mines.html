<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mines - Big Daddy</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #12121a; color: #fff; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 440px; background: #191924; min-height: 100vh; padding: 15px; display: flex; flex-direction: column; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .back-link { color: #f1c40f; text-decoration: none; font-size: 14px; font-weight: bold; }
        .wallet-box { background: linear-gradient(135deg, #d4af37, #aa7c11); padding: 6px 14px; border-radius: 20px; font-size: 14px; color: #000; font-weight: bold; }
        .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 15px 0; background: #0e0e15; padding: 12px; border-radius: 12px; }
        .tile { aspect-ratio: 1; background: #262638; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; border: 2px solid #33334d; }
        .tile.open-safe { background: #00c988; border-color: #00ffaa; }
        .tile.open-bomb { background: #ff4757; border-color: #ff6b81; }
        .control-panel { background: #222232; padding: 15px; border-radius: 12px; display: flex; flex-direction: column; gap: 12px; }
        .btn-action { width: 100%; padding: 14px; border-radius: 8px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; background: #00c988; color: #fff; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <a href="/" class="back-link">⬅ Lobby</a>
        <div class="wallet-box" id="wallet-balance">₹ 1000.00</div>
    </div>
    <div style="background:#222232; padding:10px; border-radius:8px; text-align:center; font-weight:bold; color:#00ffcc;" id="mult-banner">
        Multiplier: 1.00x
    </div>
    <div class="mines-grid" id="grid"></div>
    <div class="control-panel">
        <button class="btn-action" id="main-btn" onclick="startGame()">START MINES GAME</button>
    </div>
</div>

<script>
    let gridEl = document.getElementById('grid');
    let playing = false;
    let bombPos = [];
    let currentMult = 1.0;

    function renderGrid() {
        gridEl.innerHTML = '';
        for(let i=0; i<25; i++) {
            let t = document.createElement('div');
            t.className = 'tile';
            t.onclick = () => openTile(i, t);
            gridEl.appendChild(t);
        }
    }
    renderGrid();

    function startGame() {
        playing = true;
        currentMult = 1.0;
        document.getElementById('mult-banner').innerText = 'Multiplier: 1.00x';
        document.getElementById('main-btn').innerText = 'CLICK ON TILES';
        renderGrid();
        bombPos = [];
        while(bombPos.length < 3) {
            let r = Math.floor(Math.random() * 25);
            if(!bombPos.includes(r)) bombPos.push(r);
        }
    }

    function openTile(idx, tile) {
        if(!playing || tile.classList.contains('open-safe')) return;
        if(bombPos.includes(idx)) {
            tile.classList.add('open-bomb');
            tile.innerText = '💣';
            document.getElementById('mult-banner').innerText = 'BOOM! GAME OVER';
            playing = false;
            document.getElementById('main-btn').innerText = 'START AGAIN';
        } else {
            tile.classList.add('open-safe');
            tile.innerText = '💎';
            currentMult = (currentMult * 1.3).toFixed(2);
            document.getElementById('mult-banner').innerText = `Multiplier: ${currentMult}x`;
        }
    }
</script>
</body>
</html>
