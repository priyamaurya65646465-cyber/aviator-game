<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviator Crash Game</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0b0c10; color: #fff; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 440px; background: #12121a; min-height: 100vh; padding: 15px; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .back-link { color: #f1c40f; text-decoration: none; font-size: 14px; font-weight: bold; }
        .wallet-box { background: #222232; padding: 6px 14px; border-radius: 20px; font-size: 14px; color: #00ffcc; font-weight: bold; border: 1px solid #33334d; }

        .game-canvas-box { position: relative; width: 100%; height: 260px; background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%); border-radius: 14px; border: 2px solid #202b38; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        .multiplier-text { font-size: 48px; font-weight: 900; color: #fff; z-index: 10; }
        .crashed-text { color: #ff3838; font-size: 20px; font-weight: bold; margin-top: 8px; z-index: 10; display: none; }
        .plane-icon { font-size: 46px; position: absolute; transition: transform 0.1s linear; }

        .betting-box { margin-top: 20px; background: #1c1c2b; padding: 15px; border-radius: 12px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 12px; }
        .bet-input { flex: 1; padding: 12px; background: #0e0e17; border: 1px solid #33334d; border-radius: 8px; color: #fff; font-size: 16px; font-weight: bold; text-align: center; }
        
        .btn-action { width: 100%; padding: 14px; border-radius: 8px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-bet { background: #00c988; color: #000; }
        .btn-cashout { background: #f39c12; color: #000; }
        .btn-disabled { background: #3d3d54; color: #7f7f9e; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <a href="/" class="back-link">⬅ Lobby</a>
        <div class="wallet-box" id="wallet-balance">₹ 1000.00</div>
    </div>

    <!-- Crash Screen -->
    <div class="game-canvas-box">
        <div class="multiplier-text" id="mult-display">1.00x</div>
        <div class="crashed-text" id="crash-alert">FLEW AWAY!</div>
        <div class="plane-icon" id="plane">✈️</div>
    </div>

    <!-- Bet Control -->
    <div class="betting-box">
        <div class="input-group">
            <input type="number" class="bet-input" id="bet-amount" value="50" min="10" step="10">
        </div>
        <button class="btn-action btn-bet" id="main-btn" onclick="handleButtonClick()">PLACE BET</button>
    </div>
</div>

<script>
    const socket = io();
    let balance = 1000;
    let hasBet = false;
    let cashedOut = false;
    let currentMultiplier = 1.0;
    let isFlying = false;

    const multDisplay = document.getElementById('mult-display');
    const crashAlert = document.getElementById('crash-alert');
    const mainBtn = document.getElementById('main-btn');
    const walletEl = document.getElementById('wallet-balance');
    const plane = document.getElementById('plane');

    socket.on('aviator_tick', (mult) => {
        isFlying = true;
        currentMultiplier = mult;
        multDisplay.innerText = mult.toFixed(2) + 'x';
        multDisplay.style.color = '#fff';
        crashAlert.style.display = 'none';

        // Move plane slightly
        let progress = Math.min((mult - 1) * 20, 60);
        plane.style.transform = `translate(${progress}px, -${progress}px)`;

        if (hasBet && !cashedOut) {
            let potentialWin = (parseFloat(document.getElementById('bet-amount').value) * mult).toFixed(2);
            mainBtn.className = 'btn-action btn-cashout';
            mainBtn.innerText = `CASHOUT ₹${potentialWin}`;
        }
    });

    socket.on('aviator_crash', (finalMult) => {
        isFlying = false;
        crashAlert.style.display = 'block';
        multDisplay.style.color = '#ff3838';
        multDisplay.innerText = finalMult.toFixed(2) + 'x';
        plane.style.transform = `translate(150px, -150px) rotate(-30deg)`;

        if (hasBet && !cashedOut) {
            alert('Oh no! Plane flew away before cashout.');
        }

        hasBet = false;
        cashedOut = false;
        mainBtn.className = 'btn-action btn-bet';
        mainBtn.innerText = 'PLACE BET';
    });

    function handleButtonClick() {
        if (!hasBet && !isFlying) {
            // Place Bet
            let amt = parseFloat(document.getElementById('bet-amount').value);
            if (amt > balance || amt <= 0) return alert('Invalid balance or bet amount');

            balance -= amt;
            walletEl.innerText = `₹ ${balance.toFixed(2)}`;
            hasBet = true;
            cashedOut = false;
            mainBtn.className = 'btn-action btn-disabled';
            mainBtn.innerText = 'WAITING FOR ROUND...';
        } else if (hasBet && isFlying && !cashedOut) {
            // Cashout
            let amt = parseFloat(document.getElementById('bet-amount').value);
            let winAmt = amt * currentMultiplier;
            balance += winAmt;
            walletEl.innerText = `₹ ${balance.toFixed(2)}`;
            cashedOut = true;
            alert(`🎉 CASHOUT SUCCESS! You won ₹${winAmt.toFixed(2)}`);
            mainBtn.className = 'btn-action btn-disabled';
            mainBtn.innerText = 'CASHED OUT';
        }
    }
</script>
</body>
</html>
